name: Setup Rootform
description: Install and verify an exact published Rootform CLI; prepare nothing
author: Rootform
inputs:
  version:
    description: "Exact published version; omit to reuse a verified version in this job"
    required: false
    default: ""
  github-token:
    description: "GitHub token for release API requests"
    required: false
    default: "${{ github.token }}"
outputs:
  version:
    description: "Verified Rootform CLI version"
  sha256:
    description: "SHA-256 of the verified executable"
runs:
  using: node24
  main: ../dist/setup/index.js
branding:
  icon: map
  color: blue
