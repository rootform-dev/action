name: Setup Rootform
description: Install and verify an exact published Rootform CLI; prepare nothing
author: Rootform
inputs:
  version:
    description: "Exact published Rootform version; omit only to reuse an earlier Rootform Action step"
    required: false
    default: ""
  github-token:
    description: "Optional GitHub API token for release rate limits; root comment uses it only when enabled"
    required: false
    default: "${{ github.token }}"
outputs:
  version:
    description: "Exact verified Rootform CLI version"
  sha256:
    description: "SHA-256 of the verified installed executable"
runs:
  using: node24
  main: ../dist/setup/index.js
branding:
  icon: map
  color: blue
