name: Rootform
description: Analyze or compare evidence, evaluate selected Policies, and present Rootform reports in GitHub
author: Rootform
inputs:
  version:
    description: "Exact published Rootform version; omit only to reuse an earlier Rootform Action step"
    required: false
    default: ""
  github-token:
    description: "Optional GitHub API token for release rate limits; root comment uses it only when enabled"
    required: false
    default: "${{ github.token }}"
  project:
    description: "Rootform project directory for raw evidence or Policy Pack selection; default workspace"
    required: false
    default: ""
  locked:
    description: "Require and preserve the project rootform.lock for analysis or Policy selection"
    required: false
    default: "false"
  offline:
    description: "Prepare selected external content without network access"
    required: false
    default: "false"
  cache:
    description: "Cache verified external Dialect and Policy Pack sources selected by the project lock"
    required: false
    default: "true"
  input:
    description: "Plan JSON, state JSON, or saved Form file"
    required: false
    default: ""
  plan-file:
    description: "Optional saved binary plan paired with input; supplied pairing must verify"
    required: false
    default: ""
  before:
    description: "Before operand: plan JSON, state JSON, or single-input Form"
    required: false
    default: ""
  after:
    description: "After operand: plan JSON, state JSON, or single-input Form"
    required: false
    default: ""
  before-plan-file:
    description: "Optional saved plan paired with before; supplied pairing must verify"
    required: false
    default: ""
  after-plan-file:
    description: "Optional saved plan paired with after; supplied pairing must verify"
    required: false
    default: ""
  stage:
    description: "Architecture stage to present or evaluate: planned, refreshed, recorded"
    required: false
    default: ""
  before-stage:
    description: "Before architecture stage: planned, refreshed, recorded; CLI default when omitted"
    required: false
    default: ""
  after-stage:
    description: "After architecture stage: planned, refreshed, recorded; CLI default when omitted"
    required: false
    default: ""
  side:
    description: "Comparison sides to check: before, after, both; CLI default is both"
    required: false
    default: ""
  policy:
    description: "Policy selectors, one per line; narrows explicitly selected Policy Packs"
    required: false
    default: ""
  policy-pack:
    description: "Policy Pack source directories or compiled files, one path per line"
    required: false
    default: ""
  check:
    description: "Evaluate all project-selected Policies even without explicit selector or overlay"
    required: false
    default: "false"
  summary:
    description: "Append CLI Markdown to GitHub Job Summary"
    required: false
    default: "true"
  upload-artifact:
    description: "Persist only Form and derived reports as one GitHub artifact"
    required: false
    default: "true"
  artifact-name:
    description: "Optional stable artifact name; default is unique per invocation, including matrix jobs"
    required: false
    default: ""
  retention-days:
    description: "Artifact retention from 1 to 90 days, subject to repository limit"
    required: false
    default: "7"
  comment:
    description: "Opt in to one current same-repository PR comment; requires serialized reporter job and write permission"
    required: false
    default: "false"
outputs:
  version:
    description: "Exact verified Rootform CLI version"
  form:
    description: "Reusable same-job path to the Form; compare returns a Comparison Form"
  report:
    description: "Reusable same-job path to complete CLI Markdown report"
  html:
    description: "Reusable same-job path to self-contained HTML Explorer"
  result:
    description: "Reusable same-job path to Policy result JSON"
  sarif:
    description: "Reusable same-job path to Policy result SARIF"
  exit-code:
    description: "Exact Rootform check exit code, published before applying its gate"
  artifact-id:
    description: "Uploaded GitHub artifact ID for cross-job download"
  artifact-url:
    description: "Uploaded GitHub evidence artifact URL"
runs:
  using: node24
  main: dist/main/index.js
branding:
  icon: map
  color: blue
