name: Rootform
description: Install Rootform, analyze Terraform or a plan, and publish verified results
author: Rootform
inputs:
  version:
    description: Exact Rootform version or latest
    required: false
    default: latest
  github-token:
    description: Optional token for authenticated Rootform release access
    required: false
    default: ""
  mode:
    description: Input mode, source or plan
    required: false
    default: source
  path:
    description: Terraform directory in source mode or JSON plan file in plan mode
    required: false
    default: .
  output-directory:
    description: New workspace-relative result directory
    required: false
    default: rootform-results
  artifact-name:
    description: GitHub Actions artifact name
    required: false
    default: rootform
  upload-artifact:
    description: Upload fixed Rootform result evidence
    required: false
    default: "true"
  fail-on-violations:
    description: Fail job when Rootform check exits 1
    required: false
    default: "true"
  report-diff:
    description: Generate exact Rootform architecture diff evidence
    required: false
    default: "false"
  baseline-path:
    description: Baseline Terraform directory for source diff reporting
    required: false
    default: ""
  fail-on-changes:
    description: Fail job when Rootform diff exits 1
    required: false
    default: "false"
  pull-request-token:
    description: Optional same-repository pull request comment token
    required: false
    default: ""
outputs:
  version:
    description: Exact installed Rootform version
  exit-code:
    description: Exact Rootform check exit code
  architecture:
    description: Workspace-relative Architecture IR path
  html:
    description: Workspace-relative self-contained HTML path
  policy-json:
    description: Workspace-relative policy JSON path
  sarif:
    description: Workspace-relative SARIF path
  diff-exit-code:
    description: Exact Rootform diff exit code when report-diff is enabled
  diff-json:
    description: Workspace-relative architecture diff JSON path
  diff-markdown:
    description: Workspace-relative architecture diff Markdown path
  baseline-architecture:
    description: Workspace-relative baseline Architecture IR path in source mode
  baseline-html:
    description: Workspace-relative baseline self-contained HTML path in source mode
  artifact-id:
    description: Uploaded GitHub Actions artifact identifier
  artifact-url:
    description: Uploaded GitHub Actions artifact URL
runs:
  using: node24
  main: dist/main/index.js
branding:
  icon: map
  color: blue
