name: Init Rootform
description: Prepare exact project-selected external content with the verified Rootform CLI
author: Rootform
inputs:
  version:
    description: "Exact published version; omit to reuse a verified version in this job"
    required: false
    default: ""
  github-token:
    description: "GitHub token for release API requests"
    required: false
    default: "${{ github.token }}"
  project:
    description: "Project directory for raw evidence or Policy selection; defaults to workspace"
    required: false
    default: ""
  locked:
    description: "Require and preserve existing rootform.lock"
    required: false
    default: "false"
  offline:
    description: "Prepare selected external content without network access"
    required: false
    default: "false"
  cache:
    description: "Cache verified external sources selected by rootform.lock"
    required: false
    default: "true"
outputs:
  version:
    description: "Verified Rootform CLI version"
runs:
  using: node24
  main: ../dist/init/index.js
branding:
  icon: map
  color: blue
