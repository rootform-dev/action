name: Compare Rootform
description: Compare two plan, state or Form operands; produce one Comparison Form and reports
author: Rootform
inputs:
  version:
    description: "Exact published version; omit to reuse a verified version in this job"
    required: false
    default: ""
  github-token:
    description: "GitHub token for release API requests"
    required: false
    default: "${{ github.token }}"
  before:
    description: "Before plan JSON, state JSON or single-input Form"
    required: false
    default: ""
  after:
    description: "After plan JSON, state JSON or single-input Form"
    required: false
    default: ""
  before-plan-file:
    description: "Matching saved plan for before; pairing must verify"
    required: false
    default: ""
  after-plan-file:
    description: "Matching saved plan for after; pairing must verify"
    required: false
    default: ""
  before-stage:
    description: "Before stage: planned, refreshed or recorded"
    required: false
    default: ""
  after-stage:
    description: "After stage: planned, refreshed or recorded"
    required: false
    default: ""
  project:
    description: "Project directory for raw evidence or Policy selection; defaults to workspace"
    required: false
    default: ""
  locked:
    description: "Require and preserve existing rootform.lock"
    required: false
    default: "false"
  offline:
    description: "Prepare selected external content without network access"
    required: false
    default: "false"
  cache:
    description: "Cache verified external sources selected by rootform.lock"
    required: false
    default: "true"
  summary:
    description: "Append CLI Markdown to GitHub Job Summary"
    required: false
    default: "true"
  upload-artifact:
    description: "Upload Form and derived reports as one artifact; never raw inputs"
    required: false
    default: "true"
  artifact-name:
    description: "Artifact name; defaults to a unique name per invocation, including matrix jobs"
    required: false
    default: ""
  retention-days:
    description: "Artifact retention: 1–90 days, capped by repository limit"
    required: false
    default: "7"
outputs:
  version:
    description: "Verified Rootform CLI version"
  form:
    description: "Path to the generated Comparison Form"
  report:
    description: "Path to the complete CLI Markdown report"
  html:
    description: "Path to the self-contained HTML Explorer"
  artifact-id:
    description: "Uploaded artifact ID for cross-job download"
  artifact-url:
    description: "Uploaded artifact URL"
runs:
  using: node24
  main: ../dist/compare/index.js
branding:
  icon: map
  color: blue
