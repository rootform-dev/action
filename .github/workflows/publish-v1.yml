name: publish first v1 ref

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Exact reviewed and publicly qualified dev merge commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-first-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Create first ref from reviewed green dev, never rewrite a ref
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')" = success
          test -n "$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "dev") | .number')"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1" > /dev/null 2>&1; then
            echo 'v1 already exists; this workflow never updates published refs.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1 -f "sha=$EXPECTED_SHA" --jq '{ref, sha: .object.sha}'
